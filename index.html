<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drawer Close &amp; Coin Resupply</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --ink: #0f172a;
      --ink-muted: #475569;
      --ink-subtle: #64748b;
      --border: #cbd5e1;
      --border-strong: #94a3b8;
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --accent-soft: #f0f9ff;
      --accent-border: #7dd3fc;
      --success: #059669;
      --success-soft: #ecfdf5;
      --success-border: #6ee7b7;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --radius: 12px;
      --radius-sm: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 88px;
    }

    button, input {
      font-family: inherit;
      touch-action: manipulation;
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    /* Top App Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #0f172a;
      color: #f8fafc;
      border-bottom: 1px solid #1e293b;
      box-shadow: var(--shadow-md);
    }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "title reset"
        "sub stepper";
      align-items: center;
      gap: 6px 8px;
    }

    @media (min-width: 620px) {
      .topbar-inner {
        grid-template-columns: 1fr auto auto;
        grid-template-areas:
          "title stepper reset"
          "sub stepper reset";
        gap: 2px 10px;
      }
    }

    .brand-title {
      grid-area: title;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #38bdf8;
      min-width: 0;
    }

    .brand-sub {
      grid-area: sub;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .top-reset-btn {
      grid-area: reset;
      justify-self: end;
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: rgba(220, 38, 38, 0.18);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .top-reset-btn:active {
      background: rgba(220, 38, 38, 0.35);
      color: #ffffff;
    }

    .checkout-stepper {
      grid-area: stepper;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: var(--radius-sm);
      padding: 4px 8px;
    }

    .checkout-stepper-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #cbd5e1;
    }

    .mini-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-btn:active {
      background: #334155;
    }

    .checkout-count-val {
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      font-size: 15px;
      color: #ffffff;
    }

    /* Sequence Navigation Rail */
    .rail-wrap {
      background: #1e293b;
      border-top: 1px solid #334155;
    }

    .rail {
      max-width: 760px;
      margin: 0 auto;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .rail::-webkit-scrollbar {
      display: none;
    }

    .rail-pill {
      flex: 0 0 auto;
      min-width: 74px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .rail-pill.active {
      background: var(--accent);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }

    .rail-pill.summary-pill {
      border-color: #475569;
      background: #0f172a;
    }

    .rail-pill.summary-pill.active {
      background: var(--success);
      border-color: #34d399;
      color: #ffffff;
    }

    .rail-pill-top {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rail-tag {
      font-size: 9px;
      padding: 0 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
    }

    .rail-pill-val {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* Main Container */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Step Banner */
    .step-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .step-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .step-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--ink-muted);
    }

    .step-badge.first-counted {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .ghost-btn {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .ghost-btn:active {
      background: #e2e8f0;
    }

    /* Dual Fields: Manual Cash + Automated Coin Bags */
    .dual-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .dual-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .field-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      background: var(--surface-alt);
    }

    .field-box.auto-box {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .field-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .field-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .auto-box .field-title {
      color: var(--accent-dark);
    }

    .bag-count-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--accent-dark);
      border: 1px solid var(--accent-border);
    }

    .money-input-wrap {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      height: 48px;
      transition: border-color 0.15s ease;
    }

    .money-input-wrap:focus-within {
      border-color: var(--accent);
    }

    .money-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      text-align: right;
      padding-right: 6px;
    }

    .money-input::placeholder {
      color: #94a3b8;
    }

    .currency-suffix {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 800;
      color: var(--ink-subtle);
    }

    .auto-amount {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-dark);
      line-height: 1.2;
      margin-top: 2px;
    }

    .auto-breakdown {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 4px;
      min-height: 16px;
      word-break: break-word;
    }

    /* Subtotal Strip */
    .subtotal-strip {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .subtotal-left {
      display: flex;
      flex-direction: column;
    }

    .subtotal-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #065f46;
    }

    .subtotal-formula {
      font-size: 11px;
      color: #047857;
      margin-top: 1px;
    }

    .subtotal-value {
      font-size: 22px;
      font-weight: 800;
      color: #065f46;
    }

    /* Coin Bag Grid (2 columns on smartphone) */
    .bag-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .bag-card {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-alt);
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .bag-card.has-qty {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .bag-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px;
    }

    .coin-denom {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .coin-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .bag-unit-price {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-subtle);
    }

    .bag-line-total {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
      margin: 4px 0 8px 0;
      text-align: center;
    }

    .bag-card.has-qty .bag-line-total {
      color: var(--accent-dark);
      font-weight: 800;
    }

    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .step-btn {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: #ffffff;
      color: var(--ink);
      font-size: 22px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .step-btn:active {
      transform: scale(0.96);
    }

    .step-btn.minus:disabled {
      opacity: 0.35;
      cursor: default;
      transform: none;
    }

    .step-btn.plus {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #ffffff;
    }

    .step-btn.plus:active {
      background: var(--accent-dark);
    }

    .bag-qty-val {
      flex: 1;
      text-align: center;
      font-size: 19px;
      font-weight: 800;
      color: var(--ink);
    }

    /* Summary View */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 480px) {
      .kpi-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-card.primary {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }

    .kpi-card.primary .kpi-label {
      color: #94a3b8;
    }

    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      margin-top: 4px;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .kpi-card.primary .kpi-sub {
      color: #cbd5e1;
    }

    /* Responsive Tables */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 8px 7px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #f1f5f9;
      color: var(--ink-muted);
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    th:first-child, td:first-child {
      text-align: left;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      background: #ffffff;
      z-index: 2;
      border-right: 1px solid var(--border);
      font-weight: 700;
    }

    th.sticky-col {
      background: #f1f5f9;
      z-index: 3;
    }

    tr.total-row td {
      background: #f8fafc;
      font-weight: 800;
      border-top: 2px solid var(--border-strong);
    }

    tr.total-row td.sticky-col {
      background: #f8fafc;
    }

    tr.total-eur-row td {
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 800;
    }

    tr.total-eur-row td.sticky-col {
      background: var(--accent-soft);
    }

    .portrait-table td, .portrait-table th {
      white-space: normal;
    }

    .usage-tags {
      display: block;
      font-size: 10px;
      color: var(--ink-subtle);
      font-weight: 500;
      margin-top: 2px;
    }

    .action-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    @media (min-width: 480px) {
      .action-stack {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .action-btn {
      height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #ffffff;
    }

    .action-btn.danger {
      background: var(--danger-soft);
      border-color: #fca5a5;
      color: var(--danger);
    }

    /* Sticky Bottom Navigation Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.08);
    }

    .bottom-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .bottom-summary {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .bottom-lbl {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-subtle);
    }

    .bottom-val {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
    }

    .nav-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn {
      height: 42px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-alt);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .nav-btn.next {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #ffffff;
    }

    .nav-btn.finish {
      background: var(--success);
      border-color: #047857;
      color: #ffffff;
    }

    /* Toast & Confirmation Modal */
    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #0f172a;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 70;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: var(--radius);
      max-width: 360px;
      width: 100%;
      padding: 16px;
      box-shadow: var(--shadow-md);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 6px 0;
    }

    .modal-text {
      font-size: 13px;
      color: var(--ink-muted);
      margin: 0 0 14px 0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-title">Drawer Close // Coin Resupply</div>

      <button type="button" class="top-reset-btn" id="topResetBtn" aria-label="Reset all shift data">&#8634; Reset</button>

      <div class="brand-sub">
        <span id="orderText">Order: 6 &rarr; 1 &rarr; 2 &rarr; 3 &rarr; 4 &rarr; 5</span>
        <span class="status-pill"><span class="status-dot"></span><span id="storageStatusText">Offline Ready</span></span>
      </div>

      <div class="checkout-stepper" aria-label="Number of checkouts">
        <span class="checkout-stepper-label">Checkouts</span>
        <button type="button" class="mini-btn" id="decCheckoutsBtn" aria-label="Decrease checkouts">&minus;</button>
        <span class="checkout-count-val mono" id="checkoutCountVal">6</span>
        <button type="button" class="mini-btn" id="incCheckoutsBtn" aria-label="Increase checkouts">+</button>
      </div>
    </div>

    <div class="rail-wrap">
      <nav class="rail" id="sequenceRail" aria-label="Checkout sequence"></nav>
    </div>
  </header>

  <main class="container" id="mainView"></main>

  <footer class="bottom-bar" id="bottomBar">
    <div class="bottom-inner">
      <div class="bottom-summary">
        <span class="bottom-lbl" id="bottomLabel">CHECKOUT #6 SUBTOTAL</span>
        <span class="bottom-val mono" id="bottomValue">0,00 &euro;</span>
      </div>
      <div class="nav-btns">
        <button type="button" class="nav-btn" id="prevStepBtn">&larr; Prev</button>
        <button type="button" class="nav-btn next" id="nextStepBtn">Next #1 &rarr;</button>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <div class="modal-card">
      <h3 class="modal-title" id="resetModalTitle">Reset Current Shift?</h3>
      <p class="modal-text">This will clear all manual cash counts and coin bag quantities across every checkout.</p>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="cancelResetBtn">Cancel</button>
        <button type="button" class="action-btn danger" style="height:34px;padding:0 12px;" id="confirmResetBtn">Reset All</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var COIN_BAGS = [
        { id: 'c001', label: '0,01 \u20ac', shortLabel: '0,01\u20ac', bagCents: 50,   color: '#b45309' },
        { id: 'c002', label: '0,02 \u20ac', shortLabel: '0,02\u20ac', bagCents: 100,  color: '#b45309' },
        { id: 'c005', label: '0,05 \u20ac', shortLabel: '0,05\u20ac', bagCents: 250,  color: '#b45309' },
        { id: 'c010', label: '0,10 \u20ac', shortLabel: '0,10\u20ac', bagCents: 400,  color: '#d97706' },
        { id: 'c020', label: '0,20 \u20ac', shortLabel: '0,20\u20ac', bagCents: 800,  color: '#d97706' },
        { id: 'c050', label: '0,50 \u20ac', shortLabel: '0,50\u20ac', bagCents: 2000, color: '#d97706' },
        { id: 'c100', label: '1,00 \u20ac', shortLabel: '1,00\u20ac', bagCents: 2500, color: '#0284c7' },
        { id: 'c200', label: '2,00 \u20ac', shortLabel: '2,00\u20ac', bagCents: 5000, color: '#0284c7' }
      ];

      var STORAGE_KEY = 'drawer_close_resupply_standalone_v2';

      var state = {
        numCheckouts: 6,
        activeView: 'checkout', // 'checkout' | 'summary'
        activeCheckout: 6,
        drawers: {}
      };

      function createEmptyDrawer() {
        var bags = {};
        for (var i = 0; i < COIN_BAGS.length; i++) {
          bags[COIN_BAGS[i].id] = 0;
        }
        return {
          manualRaw: '',
          manualCents: 0,
          bags: bags
        };
      }

      function ensureDrawers() {
        for (var c = 1; c <= state.numCheckouts; c++) {
          if (!state.drawers[c]) {
            state.drawers[c] = createEmptyDrawer();
          } else {
            for (var i = 0; i < COIN_BAGS.length; i++) {
              var id = COIN_BAGS[i].id;
              if (typeof state.drawers[c].bags[id] !== 'number') {
                state.drawers[c].bags[id] = 0;
              }
            }
          }
        }
      }

      // Counting order: Last checkout first, then 1, 2, ..., N-1
      function getCountingSequence(n) {
        if (n <= 1) return [1];
        var seq = [n];
        for (var i = 1; i < n; i++) {
          seq.push(i);
        }
        return seq;
      }

      function formatEuro(cents) {
        var negative = cents < 0;
        var abs = Math.abs(Math.round(cents));
        var euros = Math.floor(abs / 100);
        var rem = abs % 100;
        var euroStr = euros.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        var centStr = rem < 10 ? '0' + rem : String(rem);
        return (negative ? '-' : '') + euroStr + ',' + centStr + ' \u20ac';
      }

      function formatNumberPlain(cents) {
        var abs = Math.abs(Math.round(cents));
        var euros = Math.floor(abs / 100);
        var rem = abs % 100;
        return euros + ',' + (rem < 10 ? '0' + rem : String(rem));
      }

      function parseEuroInputToCents(raw) {
        if (!raw) return 0;
        var cleaned = String(raw).replace(/[^\d.,]/g, '');
        if (!cleaned) return 0;
        var lastComma = cleaned.lastIndexOf(',');
        var lastDot = cleaned.lastIndexOf('.');
        var sepIndex = Math.max(lastComma, lastDot);
        var normalized;
        if (sepIndex !== -1) {
          var intPart = cleaned.slice(0, sepIndex).replace(/[.,]/g, '');
          var fracPart = cleaned.slice(sepIndex + 1).replace(/[.,]/g, '');
          normalized = (intPart || '0') + '.' + fracPart;
        } else {
          normalized = cleaned;
        }
        var num = parseFloat(normalized);
        if (isNaN(num) || num < 0) return 0;
        return Math.round(num * 100);
      }

      function getDrawerBagStats(drawer) {
        var totalCents = 0;
        var totalBags = 0;
        var parts = [];
        for (var i = 0; i < COIN_BAGS.length; i++) {
          var bag = COIN_BAGS[i];
          var qty = drawer.bags[bag.id] || 0;
          if (qty > 0) {
            totalBags += qty;
            totalCents += qty * bag.bagCents;
            parts.push(qty + '\u00d7' + bag.shortLabel);
          }
        }
        return {
          totalCents: totalCents,
          totalBags: totalBags,
          breakdown: parts.length ? parts.join(' \u00b7 ') : 'No coin bags added'
        };
      }

      function persistState() {
        var statusEl = document.getElementById('storageStatusText');
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (statusEl) statusEl.textContent = 'Saved Locally';
        } catch (e) {
          if (statusEl) statusEl.textContent = 'Session Only';
        }
      }

      function loadInitialState() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && typeof parsed.numCheckouts === 'number') {
              state = parsed;
            }
          }
        } catch (e) {}

        ensureDrawers();
        var seq = getCountingSequence(state.numCheckouts);
        if (seq.indexOf(state.activeCheckout) === -1) {
          state.activeCheckout = seq[0];
        }
        renderAll();
      }

      function showToast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(function () {
          el.classList.remove('show');
        }, 2200);
      }

      function renderTopbarAndRail() {
        var seq = getCountingSequence(state.numCheckouts);
        document.getElementById('checkoutCountVal').textContent = state.numCheckouts;
        document.getElementById('orderText').textContent = 'Order: ' + seq.join(' \u2192 ');

        var rail = document.getElementById('sequenceRail');
        var html = '';

        for (var i = 0; i < seq.length; i++) {
          var chk = seq[i];
          var d = state.drawers[chk];
          var bagStats = getDrawerBagStats(d);
          var sub = d.manualCents + bagStats.totalCents;
          var isActive = state.activeView === 'checkout' && state.activeCheckout === chk;
          var tag = (chk === state.numCheckouts && state.numCheckouts > 1) ? '<span class="rail-tag">LAST</span>' : '';

          html +=
            '<button type="button" class="rail-pill' + (isActive ? ' active' : '') + '" data-select-chk="' + chk + '">' +
              '<div class="rail-pill-top">#' + chk + ' ' + tag + '</div>' +
              '<div class="rail-pill-val mono">' + formatEuro(sub) + '</div>' +
            '</button>';
        }

        var summaryActive = state.activeView === 'summary';
        html +=
          '<button type="button" class="rail-pill summary-pill' + (summaryActive ? ' active' : '') + '" data-select-summary="1">' +
            '<div class="rail-pill-top">SUMMARY</div>' +
            '<div class="rail-pill-val">Bag Table</div>' +
          '</button>';

        rail.innerHTML = html;

        // Horizontal-only centering on the pill rail (never triggers vertical page scroll)
        var activeEl = rail.querySelector('.active');
        if (activeEl) {
          var targetLeft = activeEl.offsetLeft - (rail.clientWidth / 2) + (activeEl.offsetWidth / 2);
          rail.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
        }
      }

      function renderCheckoutView() {
        var seq = getCountingSequence(state.numCheckouts);
        var chk = state.activeCheckout;
        var stepIdx = seq.indexOf(chk);
        var drawer = state.drawers[chk];
        var bagStats = getDrawerBagStats(drawer);
        var subtotal = drawer.manualCents + bagStats.totalCents;

        var ordinal = (stepIdx + 1) + (stepIdx === 0 ? 'st' : stepIdx === 1 ? 'nd' : stepIdx === 2 ? 'rd' : 'th');
        var badgeText = 'Counted ' + ordinal + (chk === state.numCheckouts && state.numCheckouts > 1 ? ' \u00b7 Last Drawer' : '');

        var bagsHtml = '';
        for (var i = 0; i < COIN_BAGS.length; i++) {
          var b = COIN_BAGS[i];
          var qty = drawer.bags[b.id] || 0;
          var lineCents = qty * b.bagCents;
          bagsHtml +=
            '<div class="bag-card' + (qty > 0 ? ' has-qty' : '') + '" id="bagCard_' + b.id + '">' +
              '<div class="bag-card-head">' +
                '<span class="coin-denom"><span class="coin-dot" style="background:' + b.color + '"></span>' + b.label + '</span>' +
                '<span class="bag-unit-price mono">' + formatEuro(b.bagCents) + '/bag</span>' +
              '</div>' +
              '<div class="bag-line-total mono" id="bagLine_' + b.id + '">' + formatEuro(lineCents) + '</div>' +
              '<div class="stepper-row">' +
                '<button type="button" class="step-btn minus" data-bag-dec="' + b.id + '"' + (qty === 0 ? ' disabled' : '') + ' aria-label="Remove ' + b.label + ' bag">&minus;</button>' +
                '<span class="bag-qty-val mono" id="bagQty_' + b.id + '">' + qty + '</span>' +
                '<button type="button" class="step-btn plus" data-bag-inc="' + b.id + '" aria-label="Add ' + b.label + ' bag">+</button>' +
              '</div>' +
            '</div>';
        }

        var main = document.getElementById('mainView');
        main.innerHTML =
          '<div class="step-banner">' +
            '<div class="step-title">Checkout #' + chk + '</div>' +
            '<span class="step-badge' + (stepIdx === 0 ? ' first-counted' : '') + '">' + badgeText + '</span>' +
          '</div>' +

          '<section class="card">' +
            '<div class="dual-grid">' +
              '<div class="field-box">' +
                '<div class="field-top">' +
                  '<span class="field-title">Manual Money Counted</span>' +
                  '<button type="button" class="ghost-btn" id="clearManualBtn">Clear</button>' +
                '</div>' +
                '<div class="money-input-wrap">' +
                  '<input type="text" inputmode="decimal" autocomplete="off" class="money-input" id="manualMoneyInput" placeholder="0,00" value="' + escapeAttr(drawer.manualRaw) + '" aria-label="Manual money counted in euros">' +
                  '<span class="currency-suffix">&euro;</span>' +
                '</div>' +
              '</div>' +

              '<div class="field-box auto-box">' +
                '<div class="field-top">' +
                  '<span class="field-title">Coin Bags Added (Auto)</span>' +
                  '<span class="bag-count-chip mono" id="autoBagCountChip">' + bagStats.totalBags + (bagStats.totalBags === 1 ? ' bag' : ' bags') + '</span>' +
                '</div>' +
                '<div class="auto-amount mono" id="autoBagEuroVal">' + formatEuro(bagStats.totalCents) + '</div>' +
                '<div class="auto-breakdown" id="autoBagBreakdown">' + bagStats.breakdown + '</div>' +
              '</div>' +
            '</div>' +

            '<div class="subtotal-strip">' +
              '<div class="subtotal-left">' +
                '<span class="subtotal-label">Checkout #' + chk + ' Subtotal</span>' +
                '<span class="subtotal-formula mono" id="subtotalFormula">' + formatEuro(drawer.manualCents) + ' + ' + formatEuro(bagStats.totalCents) + '</span>' +
              '</div>' +
              '<div class="subtotal-value mono" id="subtotalMainVal">' + formatEuro(subtotal) + '</div>' +
            '</div>' +
          '</section>' +

          '<section class="card">' +
            '<div class="card-header">' +
              '<span class="card-label">Coin Bag Resupply (+ / &minus;)</span>' +
              '<button type="button" class="ghost-btn" id="zeroBagsBtn">Zero Bags</button>' +
            '</div>' +
            '<div class="bag-grid">' + bagsHtml + '</div>' +
          '</section>';

        var bottomBar = document.getElementById('bottomBar');
        bottomBar.style.display = 'block';
        document.getElementById('bottomLabel').textContent = 'CHECKOUT #' + chk + ' SUBTOTAL';
        document.getElementById('bottomValue').textContent = formatEuro(subtotal);

        var prevBtn = document.getElementById('prevStepBtn');
        var nextBtn = document.getElementById('nextStepBtn');
        prevBtn.disabled = stepIdx === 0;

        if (stepIdx < seq.length - 1) {
          var nextChk = seq[stepIdx + 1];
          nextBtn.textContent = 'Next #' + nextChk + ' \u2192';
          nextBtn.className = 'nav-btn next';
        } else {
          nextBtn.textContent = 'Summary Table \u2192';
          nextBtn.className = 'nav-btn finish';
        }

        var input = document.getElementById('manualMoneyInput');
        input.addEventListener('input', function (e) {
          drawer.manualRaw = e.target.value;
          drawer.manualCents = parseEuroInputToCents(drawer.manualRaw);
          updateCheckoutInPlace();
          persistState();
        });
      }

      // Updates all bag cards, auto totals, subtotals, and bottom bar in-place without resetting scroll
      function updateCheckoutInPlace() {
        var chk = state.activeCheckout;
        var drawer = state.drawers[chk];
        var bagStats = getDrawerBagStats(drawer);
        var subtotal = drawer.manualCents + bagStats.totalCents;

        for (var i = 0; i < COIN_BAGS.length; i++) {
          var b = COIN_BAGS[i];
          var qty = drawer.bags[b.id] || 0;
          var lineCents = qty * b.bagCents;

          var cardEl = document.getElementById('bagCard_' + b.id);
          if (cardEl) {
            if (qty > 0) {
              cardEl.classList.add('has-qty');
            } else {
              cardEl.classList.remove('has-qty');
            }
          }

          var lineEl = document.getElementById('bagLine_' + b.id);
          if (lineEl) lineEl.textContent = formatEuro(lineCents);

          var qtyEl = document.getElementById('bagQty_' + b.id);
          if (qtyEl) qtyEl.textContent = qty;

          var decBtn = document.querySelector('[data-bag-dec="' + b.id + '"]');
          if (decBtn) decBtn.disabled = (qty === 0);
        }

        var chipEl = document.getElementById('autoBagCountChip');
        if (chipEl) chipEl.textContent = bagStats.totalBags + (bagStats.totalBags === 1 ? ' bag' : ' bags');

        var autoEuroEl = document.getElementById('autoBagEuroVal');
        if (autoEuroEl) autoEuroEl.textContent = formatEuro(bagStats.totalCents);

        var breakdownEl = document.getElementById('autoBagBreakdown');
        if (breakdownEl) breakdownEl.textContent = bagStats.breakdown;

        var fEl = document.getElementById('subtotalFormula');
        if (fEl) fEl.textContent = formatEuro(drawer.manualCents) + ' + ' + formatEuro(bagStats.totalCents);

        var sEl = document.getElementById('subtotalMainVal');
        if (sEl) sEl.textContent = formatEuro(subtotal);

        var bEl = document.getElementById('bottomValue');
        if (bEl) bEl.textContent = formatEuro(subtotal);

        var activePillVal = document.querySelector('[data-select-chk="' + chk + '"] .rail-pill-val');
        if (activePillVal) activePillVal.textContent = formatEuro(subtotal);
      }

      function renderSummaryView() {
        var seq = getCountingSequence(state.numCheckouts);
        var grandManualCents = 0;
        var grandBagsCents = 0;
        var grandBagsQty = 0;

        var colBagQty = {};
        var colBagCents = {};
        var colUsageList = {};
        for (var bIdx = 0; bIdx < COIN_BAGS.length; bIdx++) {
          var bId = COIN_BAGS[bIdx].id;
          colBagQty[bId] = 0;
          colBagCents[bId] = 0;
          colUsageList[bId] = [];
        }

        var matrixRowsHtml = '';

        for (var s = 0; s < seq.length; s++) {
          var chk = seq[s];
          var d = state.drawers[chk];
          var rowBagQty = 0;
          var rowBagCents = 0;
          var cellsHtml = '';

          for (var i = 0; i < COIN_BAGS.length; i++) {
            var bag = COIN_BAGS[i];
            var q = d.bags[bag.id] || 0;
            rowBagQty += q;
            rowBagCents += q * bag.bagCents;
            colBagQty[bag.id] += q;
            colBagCents[bag.id] += q * bag.bagCents;
            if (q > 0) {
              colUsageList[bag.id].push('#' + chk + '\u00d7' + q);
            }
            cellsHtml += '<td class="mono">' + (q > 0 ? q : '&mdash;') + '</td>';
          }

          var rowSub = d.manualCents + rowBagCents;
          grandManualCents += d.manualCents;
          grandBagsCents += rowBagCents;
          grandBagsQty += rowBagQty;

          var lastTag = (chk === state.numCheckouts && state.numCheckouts > 1) ? ' <span class="step-badge" style="font-size:9px;padding:1px 5px;">LAST</span>' : '';

          matrixRowsHtml +=
            '<tr>' +
              '<td class="sticky-col">#' + chk + lastTag + '</td>' +
              cellsHtml +
              '<td class="mono">' + rowBagQty + '</td>' +
              '<td class="mono">' + formatEuro(rowBagCents) + '</td>' +
              '<td class="mono">' + formatEuro(d.manualCents) + '</td>' +
              '<td class="mono"><strong>' + formatEuro(rowSub) + '</strong></td>' +
            '</tr>';
        }

        var grandTotalCents = grandManualCents + grandBagsCents;

        var qtyFooterCells = '';
        var eurFooterCells = '';
        for (var j = 0; j < COIN_BAGS.length; j++) {
          var id = COIN_BAGS[j].id;
          qtyFooterCells += '<td class="mono">' + colBagQty[id] + '</td>';
          eurFooterCells += '<td class="mono">' + formatEuro(colBagCents[id]) + '</td>';
        }

        var headerBagCols = '';
        for (var h = 0; h < COIN_BAGS.length; h++) {
          headerBagCols += '<th>' + COIN_BAGS[h].shortLabel + '</th>';
        }

        var portraitRowsHtml = '';
        for (var p = 0; p < COIN_BAGS.length; p++) {
          var pb = COIN_BAGS[p];
          var totalQ = colBagQty[pb.id];
          var totalC = colBagCents[pb.id];
          var usageStr = colUsageList[pb.id].length ? colUsageList[pb.id].join(', ') : 'Unused';
          portraitRowsHtml +=
            '<tr>' +
              '<td>' +
                '<strong><span class="coin-dot" style="display:inline-block;background:' + pb.color + ';margin-right:5px;"></span>' + pb.label + '</strong>' +
                '<span class="usage-tags">' + usageStr + '</span>' +
              '</td>' +
              '<td class="mono">' + formatEuro(pb.bagCents) + '</td>' +
              '<td class="mono"><strong>' + totalQ + '</strong></td>' +
              '<td class="mono"><strong>' + formatEuro(totalC) + '</strong></td>' +
            '</tr>';
        }

        var main = document.getElementById('mainView');
        main.innerHTML =
          '<div class="step-banner">' +
            '<div class="step-title">Shift Summary &amp; Coin Bag Table</div>' +
            '<span class="step-badge">' + state.numCheckouts + (state.numCheckouts === 1 ? ' Checkout' : ' Checkouts') + '</span>' +
          '</div>' +

          '<div class="kpi-grid">' +
            '<div class="kpi-card primary">' +
              '<div class="kpi-label">Grand Total</div>' +
              '<div class="kpi-val mono">' + formatEuro(grandTotalCents) + '</div>' +
              '<div class="kpi-sub">Cash + Coin Bags</div>' +
            '</div>' +
            '<div class="kpi-card">' +
              '<div class="kpi-label">Manual Cash</div>' +
              '<div class="kpi-val mono">' + formatEuro(grandManualCents) + '</div>' +
              '<div class="kpi-sub">Counted across drawers</div>' +
            '</div>' +
            '<div class="kpi-card">' +
              '<div class="kpi-label">Coin Bags Used</div>' +
              '<div class="kpi-val mono">' + formatEuro(grandBagsCents) + '</div>' +
              '<div class="kpi-sub">' + grandBagsQty + (grandBagsQty === 1 ? ' bag total' : ' bags total') + '</div>' +
            '</div>' +
          '</div>' +

          '<section class="card">' +
            '<div class="card-header">' +
              '<span class="card-label">Bags Used by Checkout (' + seq.join(' \u2192 ') + ')</span>' +
            '</div>' +
            '<div class="table-scroll">' +
              '<table>' +
                '<thead>' +
                  '<tr>' +
                    '<th class="sticky-col">Checkout</th>' +
                    headerBagCols +
                    '<th>Bags</th>' +
                    '<th>Bags &euro;</th>' +
                    '<th>Manual &euro;</th>' +
                    '<th>Subtotal</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody>' +
                  matrixRowsHtml +
                  '<tr class="total-row">' +
                    '<td class="sticky-col">TOTAL QTY</td>' +
                    qtyFooterCells +
                    '<td class="mono">' + grandBagsQty + '</td>' +
                    '<td class="mono">&mdash;</td>' +
                    '<td class="mono">&mdash;</td>' +
                    '<td class="mono">&mdash;</td>' +
                  '</tr>' +
                  '<tr class="total-eur-row">' +
                    '<td class="sticky-col">TOTAL VALUE</td>' +
                    eurFooterCells +
                    '<td class="mono">' + grandBagsQty + '</td>' +
                    '<td class="mono">' + formatEuro(grandBagsCents) + '</td>' +
                    '<td class="mono">' + formatEuro(grandManualCents) + '</td>' +
                    '<td class="mono">' + formatEuro(grandTotalCents) + '</td>' +
                  '</tr>' +
                '</tbody>' +
              '</table>' +
            '</div>' +
          '</section>' +

          '<section class="card">' +
            '<div class="card-header">' +
              '<span class="card-label">Total by Coin Bag Denomination</span>' +
            '</div>' +
            '<table class="portrait-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>Coin Bag</th>' +
                  '<th>Bag &euro;</th>' +
                  '<th>Total Qty</th>' +
                  '<th>Total Value</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' +
                portraitRowsHtml +
                '<tr class="total-eur-row">' +
                  '<td><strong>ALL COIN BAGS</strong></td>' +
                  '<td class="mono">&mdash;</td>' +
                  '<td class="mono"><strong>' + grandBagsQty + '</strong></td>' +
                  '<td class="mono"><strong>' + formatEuro(grandBagsCents) + '</strong></td>' +
                '</tr>' +
              '</tbody>' +
            '</table>' +

            '<div class="action-stack">' +
              '<button type="button" class="action-btn primary" id="copyReportBtn">Copy Text Report</button>' +
              '<button type="button" class="action-btn" id="downloadCsvBtn">Download CSV</button>' +
              '<button type="button" class="action-btn danger" id="openResetModalBtn">Reset Shift</button>' +
            '</div>' +
          '</section>';

        document.getElementById('bottomBar').style.display = 'none';
      }

      function renderAll() {
        renderTopbarAndRail();
        if (state.activeView === 'summary') {
          renderSummaryView();
        } else {
          renderCheckoutView();
        }
      }

      function escapeAttr(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function buildTextReport() {
        var seq = getCountingSequence(state.numCheckouts);
        var lines = [];
        lines.push('DRAWER CLOSE & COIN RESUPPLY');
        lines.push('Order: ' + seq.join(' -> '));
        lines.push('--------------------------------');

        var grandManual = 0;
        var grandBags = 0;
        var totalByBag = {};
        for (var i = 0; i < COIN_BAGS.length; i++) totalByBag[COIN_BAGS[i].id] = 0;

        for (var s = 0; s < seq.length; s++) {
          var chk = seq[s];
          var d = state.drawers[chk];
          var stats = getDrawerBagStats(d);
          var sub = d.manualCents + stats.totalCents;
          grandManual += d.manualCents;
          grandBags += stats.totalCents;

          for (var j = 0; j < COIN_BAGS.length; j++) {
            var id = COIN_BAGS[j].id;
            totalByBag[id] += (d.bags[id] || 0);
          }

          lines.push('Checkout #' + chk + ': Manual ' + formatEuro(d.manualCents) + ' + Bags ' + formatEuro(stats.totalCents) + ' = ' + formatEuro(sub));
          if (stats.totalBags > 0) {
            lines.push('  Bags: ' + stats.breakdown);
          }
        }

        lines.push('--------------------------------');
        lines.push('COIN BAGS TOTALS:');
        for (var k = 0; k < COIN_BAGS.length; k++) {
          var b = COIN_BAGS[k];
          var q = totalByBag[b.id];
          lines.push('  ' + b.label + ' (' + formatEuro(b.bagCents) + '): ' + q + ' bags = ' + formatEuro(q * b.bagCents));
        }

        lines.push('--------------------------------');
        lines.push('Manual Cash Total: ' + formatEuro(grandManual));
        lines.push('Coin Bags Total:   ' + formatEuro(grandBags));
        lines.push('GRAND TOTAL:       ' + formatEuro(grandManual + grandBags));
        return lines.join('\n');
      }

      function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('Report copied to clipboard');
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Report copied to clipboard');
        } catch (e) {
          showToast('Could not copy automatically');
        }
        document.body.removeChild(ta);
      }

      function downloadCsvReport() {
        var seq = getCountingSequence(state.numCheckouts);
        var headers = ['Checkout'];
        for (var i = 0; i < COIN_BAGS.length; i++) {
          headers.push(COIN_BAGS[i].label + ' (Qty)');
        }
        headers.push('Total Bags', 'Coin Bags (EUR)', 'Manual Cash (EUR)', 'Subtotal (EUR)');

        var rows = [headers.join(';')];
        var colQty = {};
        var colCents = {};
        for (var c = 0; c < COIN_BAGS.length; c++) {
          colQty[COIN_BAGS[c].id] = 0;
          colCents[COIN_BAGS[c].id] = 0;
        }

        var grandManual = 0;
        var grandBagsCents = 0;
        var grandBagsQty = 0;

        for (var s = 0; s < seq.length; s++) {
          var chk = seq[s];
          var d = state.drawers[chk];
          var rowQty = 0;
          var rowCents = 0;
          var line = ['Checkout #' + chk];

          for (var j = 0; j < COIN_BAGS.length; j++) {
            var bag = COIN_BAGS[j];
            var q = d.bags[bag.id] || 0;
            rowQty += q;
            rowCents += q * bag.bagCents;
            colQty[bag.id] += q;
            colCents[bag.id] += q * bag.bagCents;
            line.push(q);
          }

          grandManual += d.manualCents;
          grandBagsCents += rowCents;
          grandBagsQty += rowQty;

          line.push(
            rowQty,
            formatNumberPlain(rowCents),
            formatNumberPlain(d.manualCents),
            formatNumberPlain(d.manualCents + rowCents)
          );
          rows.push(line.join(';'));
        }

        var qtyRow = ['TOTAL BAGS (QTY)'];
        var valRow = ['TOTAL VALUE (EUR)'];
        for (var k = 0; k < COIN_BAGS.length; k++) {
          var id = COIN_BAGS[k].id;
          qtyRow.push(colQty[id]);
          valRow.push(formatNumberPlain(colCents[id]));
        }
        qtyRow.push(grandBagsQty, '', '', '');
        valRow.push(grandBagsQty, formatNumberPlain(grandBagsCents), formatNumberPlain(grandManual), formatNumberPlain(grandManual + grandBagsCents));

        rows.push(qtyRow.join(';'));
        rows.push(valRow.join(';'));

        var csvContent = '\uFEFF' + rows.join('\r\n');
        var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'drawer-close-resupply.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('CSV downloaded');
      }

      document.addEventListener('click', function (e) {
        var target = e.target;

        if (target.closest('#decCheckoutsBtn')) {
          if (state.numCheckouts > 1) {
            state.numCheckouts -= 1;
            ensureDrawers();
            var seq = getCountingSequence(state.numCheckouts);
            if (seq.indexOf(state.activeCheckout) === -1) {
              state.activeCheckout = seq[0];
            }
            renderAll();
            persistState();
          }
          return;
        }

        if (target.closest('#incCheckoutsBtn')) {
          if (state.numCheckouts < 30) {
            var prevMax = state.numCheckouts;
            state.numCheckouts += 1;
            ensureDrawers();
            if (state.activeView === 'checkout' && state.activeCheckout === prevMax) {
              state.activeCheckout = state.numCheckouts;
            }
            renderAll();
            persistState();
          }
          return;
        }

        var chkPill = target.closest('[data-select-chk]');
        if (chkPill) {
          state.activeView = 'checkout';
          state.activeCheckout = parseInt(chkPill.getAttribute('data-select-chk'), 10);
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          persistState();
          return;
        }

        if (target.closest('[data-select-summary]')) {
          state.activeView = 'summary';
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          persistState();
          return;
        }

        // In-place updates for + / - so scroll position stays exactly where the user is
        var incBtn = target.closest('[data-bag-inc]');
        if (incBtn) {
          var bId = incBtn.getAttribute('data-bag-inc');
          var d = state.drawers[state.activeCheckout];
          d.bags[bId] = (d.bags[bId] || 0) + 1;
          updateCheckoutInPlace();
          persistState();
          return;
        }

        var decBtn = target.closest('[data-bag-dec]');
        if (decBtn) {
          var bIdDec = decBtn.getAttribute('data-bag-dec');
          var dDec = state.drawers[state.activeCheckout];
          if ((dDec.bags[bIdDec] || 0) > 0) {
            dDec.bags[bIdDec] -= 1;
            updateCheckoutInPlace();
            persistState();
          }
          return;
        }

        if (target.closest('#clearManualBtn')) {
          var dClear = state.drawers[state.activeCheckout];
          dClear.manualRaw = '';
          dClear.manualCents = 0;
          var inputEl = document.getElementById('manualMoneyInput');
          if (inputEl) inputEl.value = '';
          updateCheckoutInPlace();
          persistState();
          return;
        }

        if (target.closest('#zeroBagsBtn')) {
          var dZero = state.drawers[state.activeCheckout];
          for (var i = 0; i < COIN_BAGS.length; i++) {
            dZero.bags[COIN_BAGS[i].id] = 0;
          }
          updateCheckoutInPlace();
          persistState();
          return;
        }

        if (target.closest('#prevStepBtn')) {
          var seqPrev = getCountingSequence(state.numCheckouts);
          var idxPrev = seqPrev.indexOf(state.activeCheckout);
          if (idxPrev > 0) {
            state.activeCheckout = seqPrev[idxPrev - 1];
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            persistState();
          }
          return;
        }

        if (target.closest('#nextStepBtn')) {
          var seqNext = getCountingSequence(state.numCheckouts);
          var idxNext = seqNext.indexOf(state.activeCheckout);
          if (idxNext < seqNext.length - 1) {
            state.activeCheckout = seqNext[idxNext + 1];
          } else {
            state.activeView = 'summary';
          }
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          persistState();
          return;
        }

        if (target.closest('#copyReportBtn')) {
          copyTextToClipboard(buildTextReport());
          return;
        }

        if (target.closest('#downloadCsvBtn')) {
          downloadCsvReport();
          return;
        }

        if (target.closest('#topResetBtn') || target.closest('#openResetModalBtn')) {
          document.getElementById('resetModal').classList.add('open');
          return;
        }

        if (target.closest('#cancelResetBtn')) {
          document.getElementById('resetModal').classList.remove('open');
          return;
        }

        if (target.closest('#confirmResetBtn')) {
          state.drawers = {};
          ensureDrawers();
          var seqReset = getCountingSequence(state.numCheckouts);
          state.activeCheckout = seqReset[0];
          state.activeView = 'checkout';
          document.getElementById('resetModal').classList.remove('open');
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          persistState();
          showToast('Shift reset');
          return;
        }
      });

      loadInitialState();
    })();
  </script>
</body>
